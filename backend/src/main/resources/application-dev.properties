# Development only. Production must set SPRING_PROFILES_ACTIVE=prod.
spring.datasource.url=jdbc:h2:mem:pulsetrackdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Development-only admin password. Never use this profile in production.
pulsetrack.admin.password=admin123